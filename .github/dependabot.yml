version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One pull request per ecosystem keeps the review load manageable; majors stay separate.
      nest:
        patterns: ['@nestjs/*', 'nestjs-*']
      next-react:
        patterns: ['next', 'next-intl', 'react', 'react-dom', 'eslint-config-next', '@types/react*']
      prisma:
        patterns: ['prisma', '@prisma/*']
      tooling:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier', 'turbo', 'vitest', '@vitest/*', '@playwright/*']
        update-types: [minor, patch]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
