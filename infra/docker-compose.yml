# Local development services for MedTravel.
#
#   pnpm infra:up      start everything and wait until every service is healthy
#   pnpm infra:down    stop (data is kept in named volumes)
#   pnpm infra:reset   stop and delete all data
#
# Every host port and credential can be overridden from the shell or a root .env file;
# the defaults match the values in each app's .env.example.

name: medtravel

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medtravel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medtravel}
      POSTGRES_DB: ${POSTGRES_DB:-medtravel}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on first start of an empty data volume: enables pg_trgm and unaccent.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF so queued jobs survive a container restart during development.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  # S3-compatible object storage. Medical files go to the private bucket and are only ever
  # served through signed links; the public bucket holds CMS images.
  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-medtravel}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-medtravel-secret}
    ports:
      - '${S3_PORT:-9000}:9000'
      - '${S3_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot job: creates the buckets, then exits. Safe to run repeatedly.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-medtravel}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-medtravel-secret}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-medtravel-private}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-medtravel-public}
    volumes:
      - ./minio/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ['/bin/sh', '/init-buckets.sh']
    restart: 'no'

  # Catches every outgoing email. SMTP on 1025, inbox UI on 8025.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '${SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 12

  # Virus scanner for uploaded medical files. Slow to start: it loads the signature
  # database into memory (about 1 GB) before it answers.
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    ports:
      - '${CLAMAV_PORT:-3310}:3310'
    volumes:
      - clamav-data:/var/lib/clamav
      - ./clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ['CMD', '/usr/local/bin/clamdcheck.sh']
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s

volumes:
  postgres-data:
  redis-data:
  minio-data:
  clamav-data:
