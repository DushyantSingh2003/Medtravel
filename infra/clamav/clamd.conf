# clamd settings for MedTravel. Uploads go up to 500 MB, so the scanner must read that much and must say so
# when it cannot, instead of calling a file it skipped "OK".
TCPSocket 3310
TCPAddr 0.0.0.0
Foreground yes
LogTime yes
StreamMaxLength 520M
MaxFileSize 520M
MaxScanSize 520M
MaxRecursion 16
MaxFiles 20000
AlertExceedsMax yes
